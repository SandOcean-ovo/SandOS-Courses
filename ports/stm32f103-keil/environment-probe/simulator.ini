// RESET 取复位向量；短暂等待仅让调试命令完成，成功仍由内存状态判定。
LOG > .\build\simulator.log
RESET
printf("RESET pc=%08X sp=%08X vector_sp=%08X vector_pc=%08X\n", PC, SP, _RDWORD(0x08000000), _RDWORD(0x08000004))
// STM32 Flash 未在此配置中自动映射到 0；按真实向量建立调试起点。
SP = _RDWORD(0x08000000)
PC = _RDWORD(0x08000004)
xPSR = 0x01000000
printf("START pc=%08X sp=%08X xpsr=%08X\n", PC, SP, xPSR)
G, probe_finished
_sleep_(1000)
printf("ENV-KEIL-01 started=%08X done=%08X ticks=%u pendsv=%u thread=%u tick_irq=%u pendsv_irq=%u\n", g_started, g_done, g_ticks, g_pendsv, g_thread_ipsr, g_tick_ipsr, g_pendsv_ipsr)
printf("MEM %08X %08X %08X %08X\n", g_memory[0], g_memory[1], g_memory[2], g_memory[3])
printf("REG pc=%08X sp=%08X xpsr=%08X\n", PC, SP, xPSR)
printf("END-KEIL-01\n")
LOG OFF
EXIT
